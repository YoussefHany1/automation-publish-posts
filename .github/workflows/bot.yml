name: Gaming News Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Prevents more than one instance running at a time (avoids push conflicts on published.db)
concurrency:
  group: gaming-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Bot
        run: node index.js --once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          MAX_ARTICLES: ${{ secrets.MAX_ARTICLES }}
          MAX_POSTS_PER_CYCLE: ${{ secrets.MAX_POSTS_PER_CYCLE || '2' }}
          MAX_PUBLISH_ATTEMPTS: ${{ secrets.MAX_PUBLISH_ATTEMPTS || '3' }}
          POST_DELAY_MS: ${{ secrets.POST_DELAY_MS || '5000' }}
          LOG_LEVEL: info

      - name: Commit Database Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update published database"
          file_pattern: "data/published.db*"
